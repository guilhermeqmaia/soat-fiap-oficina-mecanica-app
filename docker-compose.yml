services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina_mecanica_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oficina_mecanica']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oficina_mecanica_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oficina_mecanica?schema=public
      PORT: '${PORT:-3000}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required — set it in .env or your shell env}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-1h}'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-http://localhost:3000}'
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']

volumes:
  pgdata:
