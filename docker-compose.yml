services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina_mecanica_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oficina_mecanica']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oficina_mecanica_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oficina_mecanica?schema=public
      PORT: '${PORT:-3000}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required — set it in .env or your shell env}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-1h}'
      # Testes de carga (US-F2-11): subir com THROTTLER_DISABLED=true para o k6
      # medir a app, nao o rate limiter. Vazio por padrao = throttler ativo.
      THROTTLER_DISABLED: '${THROTTLER_DISABLED:-}'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-http://localhost:3000}'
      # Mensageria (Fase 4, US-F4-06). Vazio = sobe sem broker (outbox so acumula).
      # `docker compose --profile messaging up -d` sobe o LocalStack com a topologia
      # da RFC-0006 e estes valores apontam para ele.
      SNS_TOPIC_ARN: '${SNS_TOPIC_ARN:-}'
      SQS_QUEUE_URL: '${SQS_QUEUE_URL:-}'
      AWS_REGION: '${AWS_REGION:-us-east-1}'
      AWS_ENDPOINT: '${AWS_ENDPOINT:-}'
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-test}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-test}'
      WEB_ORIGINS: '${WEB_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    entrypoint: ['sh', '-c', 'npx prisma migrate deploy && exec node dist/main.js']

  # SNS/SQS locais (RFC-0006): topicos oficina-{os,execucao,billing}.fifo e filas
  # execucao-comandos, billing-comandos, os-eventos, notificacao-eventos (+DLQs),
  # criados pelo script do kit no boot. Opcional: --profile messaging.
  localstack:
    image: localstack/localstack:3
    profiles: ['messaging']
    ports:
      - '4566:4566'
    environment:
      SERVICES: 'sns,sqs'
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./node_modules/@guilhermeqmaia/oficina-kit/scripts/messaging-local.sh:/etc/localstack/init/ready.d/10-messaging.sh:ro
    healthcheck:
      test: ['CMD', 'awslocal', 'sqs', 'list-queues']
      interval: 5s
      timeout: 5s
      retries: 20

  web-admin:
    build:
      context: ./web/admin
      args:
        VITE_API_URL: '${VITE_API_URL:-http://localhost:3000}'
    container_name: oficina_mecanica_web_admin
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      app:
        condition: service_healthy

  web-cliente:
    build:
      context: ./web/cliente
      args:
        VITE_API_URL: '${VITE_API_URL:-http://localhost:3000}'
    container_name: oficina_mecanica_web_cliente
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
