name: Security & Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Testes unitarios + cobertura (gate 80%)
  # ---------------------------------------------------------------------------
  test:
    name: Tests + Coverage (gate 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # Sonar precisa do historico completo pra blame
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests with coverage
        run: npm run test:unit:cov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-lcov
          path: coverage/unit/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Security scans (OWASP Top 10 via Semgrep + npm audit + Trivy)
  #    Falha em high/critical
  # ---------------------------------------------------------------------------
  security:
    name: Security scans (Semgrep OWASP + npm audit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      # Semgrep via imagem oficial (CLI direto substitui o action legado)
      - name: Semgrep OWASP Top 10
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.161.0 \
            semgrep --config=p/owasp-top-ten --error /src

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan (deps + secrets + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          # node_modules contem Dockerfiles de deps (bcrypt, cpu-features) que nao rodamos
          skip-dirs: node_modules,dist,coverage

  # ---------------------------------------------------------------------------
  # 3. SonarQube scan (server ephemeral como service container, artifact JSON)
  #    Nao bloqueia o PR (sem dashboard persistente); serve como prova de pipeline
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: test  # reaproveita lcov
    # Sonar nao bloqueia o merge; gera apenas artifact de evidencia da pipeline
    continue-on-error: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonar
        ports: ['5433:5432']
        options: >-
          --health-cmd="pg_isready -U sonar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      sonarqube:
        image: sonarqube:10.6.0-community
        env:
          SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonar
        ports: ['9000:9000']
        # Sem healthcheck: wget/curl podem nao existir na imagem e o escape
        # de aspas do grep quebra. O step "Wait for SonarQube ready" abaixo
        # gerencia a prontidao polling a propria API.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: coverage-lcov
          path: coverage/unit

      - name: Wait for SonarQube ready
        run: |
          # Ate 5 min (60 * 5s) aguardando API responder "UP"
          for i in {1..60}; do
            status=$(curl -s http://localhost:9000/api/system/status | grep -oE '"status":"[A-Z]+"' || true)
            echo "[$i/60] SonarQube status: $status"
            if [[ "$status" == '"status":"UP"' ]]; then
              echo "SonarQube pronto apos $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube nao ficou UP em 5 minutos" >&2
          exit 1

      - name: Change default admin password and generate token
        id: sonar_token
        run: |
          set -e

          # Gera senha aleatoria (SQ 10+ exige >=8 chars + complexidade)
          ADMIN_PASS="Ci$(openssl rand -hex 12)!A1"
          echo "::add-mask::$ADMIN_PASS"

          # Primeiro login: muda senha padrao admin/admin
          PWD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=$ADMIN_PASS")
          echo "Change password HTTP status: $PWD_STATUS"
          if [[ "$PWD_STATUS" != "204" && "$PWD_STATUS" != "200" ]]; then
            echo "Falha ao alterar senha do admin (HTTP $PWD_STATUS)" >&2
            exit 1
          fi

          # Gera token para o scanner; run_id+attempt evita colisao com outros workflows
          TOKEN_NAME="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TOKEN_JSON=$(curl -s -u "admin:$ADMIN_PASS" -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=$TOKEN_NAME")
          echo "Token response length: ${#TOKEN_JSON}"

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token // empty')
          if [[ -z "$TOKEN" ]]; then
            echo "Falha ao gerar token. Resposta: $TOKEN_JSON" >&2
            exit 1
          fi
          echo "Token gerado com sucesso (length=${#TOKEN})"

          # Confirma que o token funciona antes de passar adiante
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$TOKEN:" \
            "http://localhost:9000/api/authentication/validate")
          echo "Token validation HTTP status: $AUTH_STATUS"
          if [[ "$AUTH_STATUS" != "200" ]]; then
            echo "Token nao valida (HTTP $AUTH_STATUS)" >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run SonarScanner CLI
        uses: sonarsource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402  # v4
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}

      - name: Export Sonar issues report (OWASP tagged)
        if: always()
        env:
          TOKEN: ${{ steps.sonar_token.outputs.token }}
        run: |
          mkdir -p sonar-report
          # Reusa o token ja validado em vez da senha admin
          curl -s -u "$TOKEN:" \
            "http://localhost:9000/api/issues/search?projects=tech-challenge&tags=owasp-top10&ps=500" \
            > sonar-report/owasp-issues.json || true
          curl -s -u "$TOKEN:" \
            "http://localhost:9000/api/measures/component?component=tech-challenge&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density" \
            > sonar-report/measures.json || true

      - name: Upload Sonar report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sonar-report
          path: sonar-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. Dependency review — desativado:
  #    dependency-review-action exige GitHub Advanced Security, que e pago em
  #    repo privado. A cobertura que ela daria (bloquear dep vulneravel em PR)
  #    ja esta garantida pelo job `security` via `npm audit --audit-level=high`.
  # ---------------------------------------------------------------------------
