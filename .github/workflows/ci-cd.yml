name: CI/CD - Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Passo 1: Execução dos testes automatizados
  # ---------------------------------------------------------------------------
  automated-tests:
    name: "1️⃣ Execução dos Testes Automatizados"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:unit:cov

      - name: Run integration tests (testcontainers/Postgres)
        # testcontainers sobe um Postgres efêmero via Docker (disponível no
        # runner ubuntu-latest). Exercita os repositórios Prisma contra um banco
        # real — cobre os fluxos que os testes unitários mockam.
        run: npm run test:integration

      - name: Check coverage gate (80%)
        run: |
          COVERAGE=$(grep -oP '(?<=Lines.*?\s)\d+\.\d+' coverage/unit/lcov-report/index.html | head -1)
          echo "📊 Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below gate 80%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets gate 80%"

  # ---------------------------------------------------------------------------
  # Passo 2: Build da aplicação
  # ---------------------------------------------------------------------------
  build-application:
    name: "2️⃣ Build da Aplicação"
    runs-on: ubuntu-latest
    needs: automated-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build NestJS application
        run: npm run build

  # ---------------------------------------------------------------------------
  # Passo 3: Build da imagem Docker
  # ---------------------------------------------------------------------------
  build-docker-image:
    name: "3️⃣ Build da Imagem Docker"
    runs-on: ubuntu-latest
    needs: build-application
    permissions:
      contents: read
      packages: write # publicar a imagem no GHCR
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --production

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Docker image built successfully"

      # Publica a imagem no GitHub Container Registry. Nao roda em pull_request
      # (o GITHUB_TOKEN de forks nao tem packages:write e nao queremos publicar
      # em PR). O deploy em kind reconstrói a imagem para evitar artifacts.
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push da imagem para o GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Imagem publicada no GHCR"

  # ---------------------------------------------------------------------------
  # Passo 4: Provisionamento (Terraform) + Deploy dos manifestos (kubectl -k)
  #
  # Substitui os antigos jobs que subiam um Postgres inline com convencoes
  # divergentes. Agora o cluster e o banco vem do IaC versionado (US-F2-06) e a
  # aplicacao dos manifestos Kustomize versionados (US-F2-05) — uma unica fonte
  # de verdade para o deploy.
  #
  # Fluxo: terraform apply 01 (cluster kind) -> load da imagem no cluster ->
  # terraform apply 02 (Postgres + Secret oficina-db) -> kubectl apply -k k8s/.
  # ---------------------------------------------------------------------------
  deploy-terraform-k8s:
    name: "4️⃣ Provisionamento (Terraform) + Deploy (k8s)"
    runs-on: ubuntu-latest
    needs: build-docker-image
    timeout-minutes: 25
    env:
      TF_IN_AUTOMATION: "true"
      KIND_CLUSTER: oficina-local
      APP_IMAGE: oficina-mecanica-app:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind CLI
        # A versao DEVE casar com o kind embutido no provider tehcyx/kind (v0.11.0
        # empacota sigs.k8s.io/kind v0.31.0). Um CLI mais antigo falha no
        # `kind load` com "failed to detect containerd snapshotter".
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind version

      # --- Stage 01: cluster kind via Terraform (US-F2-06) -------------------
      - name: Terraform apply — cluster (01-cluster)
        working-directory: infra/terraform/01-cluster
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var "kind_worker_count=1"
          echo "KUBECONFIG=$HOME/.kube/oficina-mecanica.config" >> "$GITHUB_ENV"

      - name: Sanity — cluster acessível
        run: kubectl cluster-info --context "kind-${KIND_CLUSTER}"

      # --- Constrói e carrega a imagem dentro do cluster ---------------------
      # Evita depender de artifacts do GitHub Actions; algumas contas free podem
      # bater quota de artifact storage e quebrar a pipeline apesar dos testes
      # terem passado.
      - name: Build and load app image into kind
        run: |
          docker build -t "${APP_IMAGE}" .
          kind load docker-image "${APP_IMAGE}" --name "${KIND_CLUSTER}"

      # --- Stage 02: Postgres + Secret oficina-db via Terraform (US-F2-06) ---
      - name: Terraform apply — banco + secret (02-app)
        working-directory: infra/terraform/02-app
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      # --- Secret da aplicação (oficina-app) para o Kustomize agregar --------
      # Contrato single-writer-per-Secret: oficina-db vem do Terraform (acima);
      # oficina-app é o dono do Kustomize. Aqui geramos valores de CI.
      - name: Gerar k8s/secret.yaml (oficina-app) para o CI
        run: |
          cat > k8s/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: oficina-app
          type: Opaque
          stringData:
            JWT_SECRET: "$(openssl rand -base64 48)"
            WEBHOOK_APPROVAL_TOKEN: "ci-approval-token"
            NOTIFICATION_WEBHOOK_SECRET: "ci-notification-secret"
          EOF

      # --- Deploy da aplicação pelos manifestos versionados (US-F2-05) -------
      - name: kubectl apply -k k8s/
        run: kubectl apply -k k8s/

      - name: Aguardar migrations e rollout da aplicação
        run: |
          kubectl wait --for=condition=complete job/oficina-migrations -n oficina --timeout=180s \
            || kubectl logs job/oficina-migrations -n oficina --all-containers=true || true
          kubectl rollout status deployment/oficina-app -n oficina --timeout=240s

      - name: Smoke test — /health e /health/ready
        run: |
          POD=$(kubectl get pod -n oficina \
            -l app.kubernetes.io/name=oficina-app,app.kubernetes.io/component=api \
            -o jsonpath='{.items[0].metadata.name}')
          echo "🔎 Pod: $POD"
          echo "→ /health (liveness)"
          kubectl exec -n oficina "$POD" -- wget -qO- http://localhost:3000/health
          echo
          echo "→ /health/ready (readiness, checa o banco)"
          kubectl exec -n oficina "$POD" -- wget -qO- http://localhost:3000/health/ready
          echo

      - name: Verificar recursos no cluster
        if: always()
        run: |
          echo "📦 Recursos no namespace oficina:"
          kubectl get deploy,pods,svc,hpa,jobs,secret -n oficina || true

  # ---------------------------------------------------------------------------
  # Resumo: Pipeline Status
  # ---------------------------------------------------------------------------
  pipeline-summary:
    name: "✅ Resumo da Pipeline CI/CD"
    runs-on: ubuntu-latest
    needs:
      [
        automated-tests,
        build-application,
        build-docker-image,
        deploy-terraform-k8s,
      ]
    if: always()
    steps:
      - name: Display CI/CD Pipeline Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║          CI/CD Pipeline - All 4 Steps Completed               ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "1️⃣  Execução dos Testes Automatizados: ${{ needs.automated-tests.result }}"
          echo "2️⃣  Build da Aplicação: ${{ needs.build-application.result }}"
          echo "3️⃣  Build da Imagem Docker: ${{ needs.build-docker-image.result }}"
          echo "4️⃣  Provisionamento (Terraform) + Deploy (k8s): ${{ needs.deploy-terraform-k8s.result }}"
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo ""

          if [ "${{ needs.automated-tests.result }}" = "failure" ] || \
             [ "${{ needs.build-application.result }}" = "failure" ] || \
             [ "${{ needs.build-docker-image.result }}" = "failure" ] || \
             [ "${{ needs.deploy-terraform-k8s.result }}" = "failure" ]; then
            echo "❌ Pipeline FALHOU em um ou mais passos"
            echo "╚════════════════════════════════════════════════════════════════╝"
            exit 1
          fi

          echo "✅ Todos os 4 passos da CI/CD executaram com sucesso!"
          echo "╚════════════════════════════════════════════════════════════════╝"
