# Fase 4 (US-F4-06 / ADR-0013): um UNICO NLB interno, criado pelo Terraform
# (stage gateway/ do repo soat-fiap-oficina-infra-k8s), atende os tres
# servicos. Cada servico expoe um NodePort fixo que vira target group +
# listener la: OS 30080 (porta 3000), Billing 30081, Execucao 30082.
#
# Substitui o Service LoadBalancer (NLB proprio) da Fase 3 — a entrada
# `backend_listener_arn` do gateway fica vazia a partir daqui.
apiVersion: v1
kind: Service
metadata:
  name: oficina-app
  annotations:
    # Scrape do /metrics (OpenMetrics) pelo agente Datadog / Prometheus
    # (US-F3-10) — o mapeamento de nomes fica nos values do agente (repo infra-k8s).
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
      nodePort: 30080
