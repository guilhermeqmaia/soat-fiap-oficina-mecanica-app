apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-mecanica
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oficina-api-migration-reader
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-mecanica
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oficina-api-migration-reader
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-mecanica
subjects:
  - kind: ServiceAccount
    name: oficina-api
    namespace: oficina
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oficina-api-migration-reader
