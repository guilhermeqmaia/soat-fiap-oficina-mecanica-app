# Variaveis de ambiente NAO sensiveis da aplicacao.
# Segredos (JWT_SECRET, tokens de webhook) ficam no Secret `oficina-app`
# (ver secret.yaml.example) e a DATABASE_URL vem do Secret `oficina-db`
# gerado pelo Terraform (US-F2-06).
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-app-config
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/managed-by: kustomize
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Notificacoes ao cliente por e-mail via Brevo (SMTP, free tier).
  # Enquanto SMTP_USER/SMTP_PASS estiverem vazios, o adapter usa uma conta de
  # teste Ethereal (loga link de preview; nao entrega em caixas reais). Preencha
  # com a SMTP key do Brevo para enviar de verdade. Alternativas: `mock` (so loga)
  # ou `webhook` (POST assinado, requer NOTIFICATION_WEBHOOK_URL).
  NOTIFICATION_PROVIDER: "email"
  NOTIFICATION_WEBHOOK_URL: ""
  NOTIFICATION_WEBHOOK_TIMEOUT_MS: "5000"
  # Gmail SMTP para demo. Defina SMTP_PASS no Secret `oficina-app` com uma
  # App Password de 16 digitos. Sem senha, o adapter cai no Ethereal.
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "guilherme.q.maia@gmail.com"
  SMTP_PASS: ""
  EMAIL_FROM: "Oficina Mecanica <guilherme.q.maia@gmail.com>"
  JWT_EXPIRES_IN: "1h"
  # Origens permitidas no CORS. Sem ingress no MVP, as UIs do cluster sao
  # acessadas via `kubectl port-forward` -> localhost:8080 (admin) e :8081
  # (cliente); por isso essas origens entram aqui. As portas 5173/5174 cobrem o
  # `npm run dev` (Vite) local. Ajuste para o dominio do front em producao/ingress.
  WEB_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081"
  PUBLIC_BASE_URL: "http://localhost:3000"
